<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>REZA RACING 3D V2</title>

<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#02030a;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  user-select:none;
  -webkit-user-select:none;
}

body{
  touch-action:none;
}

#game{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  display:block;
  background:#03050d;
}

#fx{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:20;
}

#scan{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:21;
  opacity:.10;
  background:
    repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,.0) 0px,
      rgba(255,255,255,.0) 3px,
      rgba(255,255,255,.15) 4px
    );
}

#vignette{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:22;
  background:
    radial-gradient(
      ellipse at center,
      transparent 42%,
      rgba(0,0,0,.18) 70%,
      rgba(0,0,0,.8) 100%
    );
}

#hud{
  position:fixed;
  inset:0;
  z-index:10;
  pointer-events:none;
}

#brand{
  position:absolute;
  top:17px;
  left:20px;
  font-size:clamp(18px,3vw,30px);
  font-weight:1000;
  font-style:italic;
  letter-spacing:2px;
  text-shadow:
    3px 3px 0 #14258b,
    0 0 15px #00eaff;
}

#brand small{
  display:block;
  margin-top:3px;
  font-size:8px;
  letter-spacing:5px;
  color:#00eaff;
}

#raceInfo{
  position:absolute;
  right:20px;
  top:17px;
  text-align:right;
  font-weight:900;
  text-shadow:0 2px 5px #000;
}

#position{
  font-size:clamp(28px,5vw,50px);
  color:#ffe600;
  font-style:italic;
}

#lap{
  font-size:15px;
  letter-spacing:2px;
}

#timer{
  margin-top:3px;
  font-family:monospace;
  color:#bfefff;
}

#speedPanel{
  position:absolute;
  right:18px;
  bottom:22px;
  text-align:right;
}

#speed{
  font-size:clamp(60px,11vw,110px);
  line-height:.75;
  font-weight:1000;
  font-style:italic;
  text-shadow:
    0 0 8px #00eaff,
    0 0 25px rgba(0,234,255,.5);
}

#kmh{
  margin-top:8px;
  font-size:12px;
  letter-spacing:5px;
  opacity:.8;
}

#gear{
  margin-top:5px;
  font-size:17px;
  font-weight:900;
  color:#ffe600;
}

#nitro{
  position:absolute;
  left:20px;
  bottom:24px;
  width:min(300px,35vw);
}

#nitroTitle{
  font-size:11px;
  font-weight:bold;
  letter-spacing:4px;
  margin-bottom:6px;
}

#nitroOuter{
  height:16px;
  border:2px solid rgba(255,255,255,.8);
  background:#050711;
  box-shadow:0 0 15px rgba(0,234,255,.35);
}

#nitroFill{
  width:100%;
  height:100%;
  background:linear-gradient(90deg,#00eaff,#1775ff,#b800ff);
  box-shadow:0 0 15px #00eaff;
}

#message{
  position:absolute;
  left:50%;
  top:47%;
  transform:translate(-50%,-50%);
  text-align:center;
  font-size:clamp(55px,13vw,150px);
  font-weight:1000;
  font-style:italic;
  opacity:0;
  text-shadow:
    5px 5px 0 #12248b,
    0 0 30px #00eaff;
}

#damage{
  position:absolute;
  inset:0;
  border:0 solid rgba(255,0,0,.55);
  pointer-events:none;
}

#mini{
  position:absolute;
  left:20px;
  top:88px;
  width:125px;
  height:70px;
  border:1px solid rgba(0,234,255,.5);
  background:rgba(2,5,15,.5);
  overflow:hidden;
}

#miniCanvas{
  width:100%;
  height:100%;
}

.screen{
  position:fixed;
  inset:0;
  z-index:40;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at 50% 40%,rgba(0,80,180,.22),transparent 45%),
    linear-gradient(rgba(0,0,0,.1),rgba(0,0,0,.92));
}

.panel{
  width:min(720px,92vw);
  padding:38px;
  text-align:center;
  border:1px solid rgba(0,234,255,.55);
  background:
    linear-gradient(
      145deg,
      rgba(8,15,35,.94),
      rgba(2,5,14,.96)
    );
  box-shadow:
    0 0 45px rgba(0,234,255,.18),
    inset 0 0 40px rgba(20,50,150,.12);
}

.logoTitle{
  font-size:clamp(48px,11vw,105px);
  line-height:.78;
  font-weight:1000;
  font-style:italic;
  letter-spacing:-5px;
  text-shadow:
    5px 5px 0 #172486,
    0 0 30px #00eaff;
}

.sub{
  margin-top:18px;
  color:#00eaff;
  font-size:12px;
  letter-spacing:7px;
}

button{
  border:2px solid #00eaff;
  color:#fff;
  background:linear-gradient(90deg,#062a58,#15258c);
  padding:16px 38px;
  margin-top:30px;
  font-size:19px;
  font-weight:1000;
  letter-spacing:2px;
  cursor:pointer;
  box-shadow:0 0 22px rgba(0,234,255,.25);
}

button:hover{
  background:#00eaff;
  color:#02030a;
}

.controls{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:25px;
}

.key{
  padding:10px;
  border:1px solid #273452;
  background:rgba(0,0,0,.25);
  color:#b9c0d0;
  font-size:11px;
}

#finishScreen{
  display:none;
}

.result{
  margin-top:20px;
  line-height:1.8;
  font-size:20px;
}

#mobile{
  display:none;
  position:fixed;
  inset:0;
  z-index:25;
  pointer-events:none;
}

.touch{
  position:absolute;
  width:67px;
  height:67px;
  border-radius:50%;
  display:flex;
  justify-content:center;
  align-items:center;
  pointer-events:auto;
  touch-action:none;
  color:#fff;
  border:2px solid rgba(255,255,255,.5);
  background:rgba(0,0,0,.28);
  backdrop-filter:blur(3px);
  font-size:25px;
  font-weight:1000;
}

#tl{left:18px;bottom:30px}
#tr{left:98px;bottom:30px}
#tb{right:105px;bottom:30px}
#tg{right:22px;bottom:30px}
#tn{
  right:38px;
  bottom:112px;
  width:82px;
  height:82px;
  border-color:#00eaff;
  color:#00eaff;
  font-size:14px;
}

@media(max-width:800px){

  #mobile{
    display:block;
  }

  #scan{
    opacity:.06;
  }

  #mini{
    top:75px;
    left:15px;
    width:100px;
    height:55px;
  }

  #nitro{
    left:15px;
    bottom:112px;
    width:170px;
  }

  #speedPanel{
    right:14px;
    bottom:105px;
  }

  #speed{
    font-size:65px;
  }

  #brand{
    top:10px;
    left:14px;
  }

  #raceInfo{
    top:10px;
    right:14px;
  }

  .controls{
    display:none;
  }

  .panel{
    padding:28px 20px;
  }
}

<script>
/* =========================================================
   REZA RACING 3D V2
   Lightweight original pseudo-3D racing engine
   No external libraries / no external assets
========================================================= */

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

const fx=document.getElementById("fx");
const fctx=fx.getContext("2d");

const mini=document.getElementById("miniCanvas");
const mctx=mini.getContext("2d");

let W=innerWidth;
let H=innerHeight;

function resize(){
  W=canvas.width=innerWidth;
  H=canvas.height=innerHeight;

  fx.width=W;
  fx.height=H;

  mini.width=250;
  mini.height=140;
}

addEventListener("resize",resize);
resize();

/* =========================================================
   AUDIO
========================================================= */

let audioCtx=null;
let engineOsc=null;
let engineGain=null;

function initAudio(){

  if(audioCtx)return;

  try{
    audioCtx=new(
      window.AudioContext||
      window.webkitAudioContext
    )();

    engineOsc=audioCtx.createOscillator();
    engineGain=audioCtx.createGain();

    engineOsc.type="sawtooth";
    engineOsc.frequency.value=70;
    engineGain.gain.value=0.001;

    engineOsc.connect(engineGain);
    engineGain.connect(audioCtx.destination);

    engineOsc.start();

  }catch(e){}
}

function engineSound(){

  if(!audioCtx||!engineOsc)return;

  let power=player.speed/320;

  engineOsc.frequency.value=
    55+
    power*120+
    (keys[" "]?35:0);

  engineGain.gain.value=
    running ? 0.015+power*.018 : 0.001;
}

/* =========================================================
   INPUT
========================================================= */

const keys={};

addEventListener("keydown",e=>{

  let k=e.key.toLowerCase();

  keys[k]=true;

  if([
    "arrowup",
    "arrowdown",
    "arrowleft",
    "arrowright",
    " "
  ].includes(k)){
    e.preventDefault();
  }

  if(k==="r"){
    restart();
  }
});

addEventListener("keyup",e=>{
  keys[e.key.toLowerCase()]=false;
});

/* Touch */

function touch(id,key){

  const el=document.getElementById(id);

  function on(e){
    e.preventDefault();
    keys[key]=true;
  }

  function off(e){
    e.preventDefault();
    keys[key]=false;
  }

  el.addEventListener("touchstart",on,{passive:false});
  el.addEventListener("touchend",off,{passive:false});
  el.addEventListener("touchcancel",off,{passive:false});
  el.addEventListener("mousedown",on);
  el.addEventListener("mouseup",off);
  el.addEventListener("mouseleave",off);
}

touch("tl","arrowleft");
touch("tr","arrowright");
touch("tg","arrowup");
touch("tb","arrowdown");
touch("tn"," ");

/* =========================================================
   WORLD
========================================================= */

const TRACK=7200;
const SEG=80;

const world=[];

for(let z=0;z<TRACK;z+=SEG){

  world.push({

    z:z,

    curve:
      Math.sin(z*.00072)*.7+
      Math.sin(z*.0017)*.25+
      Math.sin(z*.00031)*.55,

    hill:
      Math.sin(z*.0008)*.9+
      Math.sin(z*.0021)*.3,

    city:
      (z%500<180),

    light:
      z%300<100,

    checkpoint:
      z%1800<SEG

  });
}

/* =========================================================
   PLAYER
========================================================= */

const player={
  z:0,
  x:0,
  speed:0,
  maxSpeed:260,
  lap:1,
  nitro:100,
  shake:0,
  drift:0
};

/* =========================================================
   OPPONENTS
========================================================= */

const opponents=[

  {
    name:"REBEL",
    z:260,
    x:-.35,
    speed:205,
    color:"#e62b3a",
    lap:1
  },

  {
    name:"NOVA",
    z:470,
    x:.35,
    speed:198,
    color:"#ffc400",
    lap:1
  },

  {
    name:"VOLT",
    z:690,
    x:.02,
    speed:190,
    color:"#a938ff",
    lap:1
  }

];

/* =========================================================
   GAME
========================================================= */

const TOTAL_LAPS=3;

let running=false;
let finished=false;
let startTime=0;
let raceTime=0;
let last=performance.now();

function clamp(v,a,b){
  return Math.max(a,Math.min(b,v));
}

function lerp(a,b,t){
  return a+(b-a)*t;
}

function fmt(ms){

  let s=ms/1000;

  let min=Math.floor(s/60);
  let sec=Math.floor(s%60);
  let mil=Math.floor(ms%1000);

  return(
    String(min).padStart(2,"0")+":"+
    String(sec).padStart(2,"0")+"."+
    String(mil).padStart(3,"0")
  );
}

/* =========================================================
   TRACK CURVE
========================================================= */

function curveAt(z){

  z%=TRACK;

  if(z<0)z+=TRACK;

  return(
    Math.sin(z*.00072)*.7+
    Math.sin(z*.0017)*.25+
    Math.sin(z*.00031)*.55
  );
}

function hillAt(z){

  z%=TRACK;

  if(z<0)z+=TRACK;

  return(
    Math.sin(z*.0008)*.9+
    Math.sin(z*.0021)*.3
  );
}

/* =========================================================
   PROJECTION
========================================================= */

function project(z,x){

  let rel=z-player.z;

  if(rel<0)rel+=TRACK;

  if(rel>2400)return null;

  let d=rel/2400;

  let perspective=1-d;

  let horizon=H*.39;

  let y=
    horizon+
    perspective*(H*.57)+
    hillAt(player.z+rel)*35*perspective;

  let roadHalf=
    lerp(W*.025,W*.49,
      Math.pow(perspective,1.7)
    );

  let center=
    W/2+
    curveAt(player.z+rel)*
    W*.19*
    perspective;

  return{
    x:center+x*roadHalf,
    y:y,
    center:center,
    roadHalf:roadHalf,
    d:d,
    p:perspective
  };
}

/* =========================================================
   SKY
========================================================= */

function sky(){

  let g=ctx.createLinearGradient(0,0,0,H*.55);

  g.addColorStop(0,"#020316");
  g.addColorStop(.35,"#101b47");
  g.addColorStop(.72,"#4c2368");
  g.addColorStop(1,"#9b315d");

  ctx.fillStyle=g;
  ctx.fillRect(0,0,W,H*.58);

  /* stars */

  for(let i=0;i<90;i++){

    let x=(i*173)%W;
    let y=(i*83)%(H*.34);

    let s=i%4===0?2:1;

    ctx.fillStyle=
      "rgba(255,255,255,"+
      (.25+(i%5)*.1)+")";

    ctx.fillRect(x,y,s,s);
  }

  /* moon */

  let mx=W*.77;
  let my=H*.16;
  let mr=Math.min(W,H)*.055;

  let mg=ctx.createRadialGradient(
    mx,my,0,
    mx,my,mr*1.7
  );

  mg.addColorStop(0,"rgba(255,255,255,.95)");
  mg.addColorStop(.45,"rgba(190,235,255,.8)");
  mg.addColorStop(1,"rgba(0,234,255,0)");

  ctx.fillStyle=mg;

  ctx.beginPath();
  ctx.arc(mx,my,mr*1.7,0,Math.PI*2);
  ctx.fill();

  /* moon disc */

  ctx.fillStyle="#eaf9ff";

  ctx.beginPath();
  ctx.arc(mx,my,mr,0,Math.PI*2);
  ctx.fill();

  drawCity();
}

/* =========================================================
   CITY
========================================================= */

function drawCity(){

  const base=H*.44;

  for(let i=0;i<80;i++){

    let bw=12+(i*17)%38;
    let bh=15+(i*29)%(H*.19);
    let x=(i*97)%W;

    ctx.fillStyle=
      i%5===0 ? "#10152c":"#080c1d";

    ctx.fillRect(
      x,
      base-bh,
      bw,
      bh
    );

    for(let wy=base-bh+8;wy<base-5;wy+=13){

      if((i+Math.floor(wy))%3===0){

        ctx.fillStyle=
          i%4===0 ?
          "#00eaff":
          "#ffd45b";

        ctx.fillRect(
          x+4,
          wy,
          3,
          3
        );
      }
    }
  }

  /* skyline glow */

  let gl=ctx.createLinearGradient(
    0,H*.38,
    0,H*.54
  );

  gl.addColorStop(0,"rgba(0,234,255,0)");
  gl.addColorStop(1,"rgba(255,0,160,.16)");

  ctx.fillStyle=gl;
  ctx.fillRect(0,H*.35,W,H*.25);
}

/* =========================================================
   ROAD
========================================================= */

function quad(
  x1,y1,
  x2,y2,
  x3,y3,
  x4,y4,
  fill
){

  ctx.beginPath();
  ctx.moveTo(x1,y1);
  ctx.lineTo(x2,y2);
  ctx.lineTo(x3,y3);
  ctx.lineTo(x4,y4);
  ctx.closePath();
  ctx.fillStyle=fill;
  ctx.fill();
}

function road(){

  const list=[];

  for(let i=0;i<world.length;i++){

    let p=project(world[i].z,0);

    if(p){
      list.push({
        s:world[i],
        p:p
      });
    }
  }

  list.sort(
    (a,b)=>b.p.d-a.p.d
  );

  for(let i=0;i<list.length-1;i++){

    const A=list[i];
    const B=list[i+1];

    drawRoadSegment(
      A.s,
      A.p,
      B.p
    );
  }
}
